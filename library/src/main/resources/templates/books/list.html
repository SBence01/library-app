<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Könyvek</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        nav { background-color: #333; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        nav a { color: white; text-decoration: none; margin-right: 20px; }
        table { border-collapse: collapse; width: 100%; background-color: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #333; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .btn { padding: 8px 15px; margin: 2px; text-decoration: none; border-radius: 4px; color: white; display: inline-block; }
        .btn-new { background-color: #28a745; }
        .btn-edit { background-color: #007bff; }
        .btn-delete { background-color: #dc3545; }
    </style>
</head>
<body>
    <nav>
        <a href="/">Főoldal</a>
        <a href="/books">Könyvek</a>
        <a href="/customers">Ügyfelek</a>
        <a href="/loans">Kölcsönzések</a>
        <a href="/reviews">Értékelések</a>
    </nav>

    <h1>Könyvek listája</h1>
<a href="/books/new" class="btn btn-new">+ Új könyv</a>

<table>
    <thead>
        <tr>
            <th>Cím</th>
            <th>Szerző</th>
            <th>Kiadási év</th>
            <th>Kategória</th>
            <th>Műveletek</th>
        </tr>
    </thead>
    <tbody>
        <tr th:each="book : ${books}">
            <td th:text="${book.title}"></td>
            <td th:text="${book.author}"></td>
            <td th:text="${book.publicationYear}"></td>
            <td th:text="${book.category}"></td>
            <td>
                <a th:href="@{/books/edit/{id}(id=${book.id})}" class="btn btn-edit">Szerkeszt</a>
                <a th:href="@{/books/delete/{id}(id=${book.id})}" class="btn btn-delete"
                   onclick="return confirm('Biztosan törlöd?')">Töröl</a>
            </td>
        </tr>
    </tbody>
</table>
</body>
</html>
