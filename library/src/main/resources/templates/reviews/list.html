<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Értékelések</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        nav { background-color: #333; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        nav a { color: white; text-decoration: none; margin-right: 20px; }
        table { border-collapse: collapse; width: 100%; background-color: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #333; color: white; }
        tr:nth-child(even) { background-color: #f2f2f2; }
        .btn { padding: 8px 15px; margin: 2px; text-decoration: none; border-radius: 4px; color: white; display: inline-block; }
        .btn-new { background-color: #28a745; }
        .btn-delete { background-color: #dc3545; }
    </style>
</head>
<body>
<nav>
    <a href="/">Főoldal</a>
    <a href="/books">Könyvek</a>
    <a href="/customers">Ügyfelek</a>
    <a href="/loans">Kölcsönzések</a>
    <a href="/reviews">Értékelések</a>
</nav>

<h1>Értékelések listája</h1>
<a href="/reviews/new" class="btn btn-new">+ Új értékelés</a>

<table>
    <thead>
    <tr>
        <th>Könyv</th>
        <th>Ügyfél</th>
        <th>Pontszám</th>
        <th>Vélemény</th>
        <th>Dátum</th>
        <th>Műveletek</th>
    </tr>
    </thead>
    <tbody>
    <tr th:each="review : ${reviews}">
        <td th:text="${review.book.title}"></td>
        <td th:text="${review.customer.name}"></td>
        <td th:text="${review.rating} + ' / 5'"></td>
        <td th:text="${review.comment}"></td>
        <td th:text="${review.reviewDate}"></td>
        <td>
            <a th:href="@{/reviews/delete/{id}(id=${review.id})}" class="btn btn-delete"
               onclick="return confirm('Biztosan törlöd?')">Töröl</a>
        </td>
    </tr>
    </tbody>
</table>
</body>
</html>
