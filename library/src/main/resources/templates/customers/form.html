<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Ügyfél űrlap</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; background-color: #f5f5f5; }
        nav { background-color: #333; padding: 10px; margin-bottom: 20px; border-radius: 5px; }
        nav a { color: white; text-decoration: none; margin-right: 20px; }
        form { background-color: white; padding: 20px; border-radius: 5px; max-width: 500px; }
        label { display: block; margin-top: 10px; font-weight: bold; }
        input { width: 100%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { margin-top: 20px; padding: 10px 20px; background-color: #28a745; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .btn-cancel { background-color: #6c757d; text-decoration: none; color: white; padding: 10px 20px; margin-left: 10px; border-radius: 4px; }
    </style>
</head>
<body>
<nav>
    <a href="/">Főoldal</a>
    <a href="/books">Könyvek</a>
    <a href="/customers">Ügyfelek</a>
    <a href="/loans">Kölcsönzések</a>
    <a href="/reviews">Értékelések</a>
</nav>

<h1 th:text="${customer.id != null} ? 'Ügyfél szerkesztése' : 'Új ügyfél'"></h1>

<form th:action="${customer.id != null} ? @{/customers/edit/{id}(id=${customer.id})} : @{/customers}"
      th:object="${customer}" method="post">

    <label>Név:</label>
    <input type="text" th:field="*{name}" required>

    <label>Email:</label>
    <input type="email" th:field="*{email}" required>

    <label>Telefonszám:</label>
    <input type="text" th:field="*{phoneNumber}">

    <button type="submit">Mentés</button>
    <a href="/customers" class="btn-cancel">Mégse</a>
</form>
</body>
</html>
